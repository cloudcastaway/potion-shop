<!DOCTYPE html>
<html lang="en">
    <head>
       <link rel="stylesheet" href="index.css">
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
       <link rel="icon" href="./assets/favicon.png?v=2">
       <title>Potion Shop</title>
    </head>
    <body>
        <div class="app-container">
            <h1 class="sr-only">Potion Shop</h1>
            <div class="content">
                <div class="visible" id="book-cover">
                    <img class="banner" src="./assets/banner.png" alt="Potion Shop">
                    <div class="open-book"></div>
                </div>
                <main id="book-pages">
                    <div id="first-page">
                        <div id="items-menu"></div>
                    </div>
                    <div id="second-page">
                        <div id="cart"></div>
                        <div class="modal-overlay">
                            <form class="payment-modal">
                                <button class="close-modal-btn" type="button">x</button>
                                <h1 class="form-title">Enter card details</h1>
                                <input id="customer-name" type="text" placeholder="Your name" required>
                                <input type="number" placeholder="Card number" required>
                                <input type="number" placeholder="CVV" required>
                                <button class="pay-btn">Pay</button>
                            </form>
                        </div>
                    </div>
                </main>
            </div>
        </div>
	<script src="index.js" type="module"></script>
    <script src="effects.js" type="module"></script>
    </body>
</html>
