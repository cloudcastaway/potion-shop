<html>
    <head>
       <link rel="stylesheet" href="index.css">
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    </head>
    <body>
        <title>Potion Shop</title>
        <div class="app-container">
            <img src="./assets/banner.png" alt="Potion Shop" style="width: 100%; height: auto">
            <h1 class="sr-only"></h1>
            <div class="content">
                <div class="modal-overlay visible">
                    <form class="payment-modal">
                        <button class="close-modal-btn" type="button">x</button>
                        <h1 class="form-title">Enter card details</h1>
                        <input type="text" placeholder="Your name" required>
                        <input type="number" placeholder="Card number" required>
                        <input type="number" placeholder="CVV" required>
                        <button class="pay-btn">Pay</button>
                    </form>
                </div>
                <main>
                    <div id="items-menu"></div>
                    <div id="cart"><h1>Cart</h1></div>
                </main>
            </div>
        </div>
	<script src="index.js" type="module"></script>
    </body>
</html>
